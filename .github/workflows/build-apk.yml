name: Compilar APK Reproductor

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite ejecutar la compilación manualmente en cualquier momento

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug

      - name: Subir APK generado a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: reproductor-simple-apk
          path: app/build/outputs/apk/debug/app-debug.apk
